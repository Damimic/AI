# Local development Postgres only. Not used in production — this exists so
# the backend has a real, disposable database to run against and test with.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kepler
      POSTGRES_PASSWORD: kepler_dev_only
      POSTGRES_DB: kepler
    ports:
      - "5432:5432"
    volumes:
      - kepler_pg_dev:/var/lib/postgresql/data

volumes:
  kepler_pg_dev:
